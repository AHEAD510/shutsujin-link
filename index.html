<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>⚔️ 出陣フォーム</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; background:#f6f5f2; color:#222; display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
  main { text-align:center; padding:2rem; max-width:32rem; }
  a.btn { display:inline-block; font-size:1.4rem; padding:1rem 2rem; border-radius:12px; background:#1f1f1f; color:#fff; text-decoration:none; }
  a.btn:hover { background:#000; }
  p.small { color:#666; font-size:.9rem; margin-top:1.5rem; line-height:1.6; }
  code { background:#eee; padding:.1em .3em; border-radius:4px; }
</style>
</head>
<body>
<main>
  <h1>⚔️ 出陣フォーム</h1>
  <p id="msg">Macの出陣フォームを起動します。</p>
  <a id="btn" class="btn" href="#">⚔️ 出陣フォームを開く</a>
  <p class="small">「出陣フォーム.app で開きますか？」と聞かれたら「開く」を選んでください。<br>何も起きない場合は、Macに <code>出陣フォーム.app</code> が登録されているか確認してください。<br>このページは転送専用で、送信もデータ保存も行いません。</p>
</main>
<script>
(function () {
  var id = (new URLSearchParams(location.search).get("page") || "").replace(/-/g, "").toLowerCase();
  var btn = document.getElementById("btn"), msg = document.getElementById("msg");
  if (!/^[0-9a-f]{32}$/.test(id)) {
    msg.textContent = "ページIDが不正です。Notionの「⚔️ 出陣フォームで開く」から開いてください。";
    btn.style.display = "none";
    return;
  }
  var target = "shutsujin://open?page=" + id;
  btn.href = target;
  setTimeout(function () { location.href = target; }, 300);
})();
</script>
</body>
</html>
